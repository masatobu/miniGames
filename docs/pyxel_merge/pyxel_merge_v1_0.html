<script>
// 保存データをブラウザの localStorage に残し、開き直したときに読み込ませるフック。
const LOCALSTORAGE_KEY = "pyxel_merge";
const SAVE_PATH = "/save_data.txt";
const LOAD_PATH = "/load_data.txt";

// localStorage はプライベートモードなどで例外になることがあるため、必ず try/catch で包む。
function readStorage() {
  try {
    return localStorage.getItem(LOCALSTORAGE_KEY);
  } catch (e) {
    console.warn("localStorage の読み込みに失敗:", e);
    return null;
  }
}

function writeStorage(data) {
  try {
    localStorage.setItem(LOCALSTORAGE_KEY, data);
  } catch (e) {
    console.warn("localStorage への保存に失敗:", e);
  }
}

// 1 秒ごとに、ゲームが書いた /save_data.txt を localStorage へ移す。
function setupSave(pyodide) {
  function checkAndSave() {
    try {
      if (pyodide.FS.analyzePath(SAVE_PATH).exists) {
        const data = pyodide.FS.readFile(SAVE_PATH, { encoding: "utf8" });
        writeStorage(data);
        pyodide.FS.unlink(SAVE_PATH);
      }
    } catch (e) {
      console.warn("保存データの移し替えに失敗:", e);
    }
  }
  setInterval(checkAndSave, 1000);
}

// Pyxel が pyodide を代入した瞬間（アプリの展開と実行より前）に、
// localStorage の値を /load_data.txt へ書く。GameCore の読み込みに間に合わせる。
Object.defineProperty(window.pyxelContext, "pyodide", {
  configurable: true,
  get() {
    return this._pyodide;
  },
  set(pyodide) {
    this._pyodide = pyodide;
    try {
      const data = readStorage();
      if (data !== null) {
        pyodide.FS.writeFile(LOAD_PATH, data);
      }
    } catch (e) {
      console.warn("読み込みデータの書き込みに失敗:", e);
    }
    setupSave(pyodide);
  },
});
